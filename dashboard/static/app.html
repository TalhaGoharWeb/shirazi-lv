<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020409">
  <title>SHIRAZI · Neural Link</title>
  <script src="/static/crypto.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #020409;
      --cyan:    #00f0ff;
      --violet: #8b5cf6;
      --magenta:#f0f;
      --text:    #d7e6f5;
      --muted:   #5b6b85;
      --green:   #22e58a;
      --red:     #ff5470;
      --glass:   rgba(10, 18, 34, 0.55);
      --border:  rgba(0, 240, 255, 0.14);
      --glow-c:  0 0 18px rgba(0, 240, 255, 0.35);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Rajdhani', -apple-system, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* ── animated cosmos background ── */
    #cosmos { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .aurora {
      position: fixed; inset: -20%; z-index: 0; pointer-events: none; opacity: .5;
      background:
        radial-gradient(42% 32% at 18% 12%, rgba(139,92,246,.20), transparent 70%),
        radial-gradient(38% 30% at 85% 88%, rgba(0,240,255,.14), transparent 70%),
        radial-gradient(30% 24% at 70% 20%, rgba(255,0,255,.07), transparent 70%);
      filter: blur(30px);
      animation: aurora-drift 26s ease-in-out infinite alternate;
    }
    @keyframes aurora-drift {
      from { transform: translate3d(-3%, -2%, 0) scale(1); }
      to   { transform: translate3d(3%, 3%, 0) scale(1.08); }
    }
    .grid-floor {
      position: fixed; left: -25%; right: -25%; bottom: -6%; height: 34%;
      z-index: 0; pointer-events: none; opacity: .35;
      background-image:
        linear-gradient(rgba(0,240,255,.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,.16) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: perspective(320px) rotateX(62deg);
      -webkit-mask-image: linear-gradient(to top, #000 30%, transparent 95%);
              mask-image: linear-gradient(to top, #000 30%, transparent 95%);
      animation: grid-scroll 3.2s linear infinite;
    }
    @keyframes grid-scroll { from { background-position-y: 0; } to { background-position-y: 44px; } }
    header, main, footer { position: relative; z-index: 1; }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: linear-gradient(180deg, rgba(4,8,18,.92), rgba(4,8,18,.55) 80%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .core-orb {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; position: relative;
      background: radial-gradient(circle at 35% 30%, #bffcff 0%, var(--cyan) 28%, #0a5b66 62%, #02141a 100%);
      box-shadow: var(--glow-c), inset 0 0 8px rgba(255,255,255,.35);
      animation: orb-breathe 3s ease-in-out infinite;
    }
    .core-orb::after {
      content: ''; position: absolute; inset: -7px; border-radius: 50%;
      border: 1px solid rgba(0,240,255,.5); border-top-color: transparent;
      animation: orb-spin 5s linear infinite;
    }
    @keyframes orb-breathe { 0%,100% { box-shadow: 0 0 14px rgba(0,240,255,.4), inset 0 0 8px rgba(255,255,255,.3);} 50% { box-shadow: 0 0 26px rgba(0,240,255,.75), inset 0 0 10px rgba(255,255,255,.5);} }
    @keyframes orb-spin { to { transform: rotate(360deg); } }
    .logo {
      font-family: 'Orbitron', 'Rajdhani', sans-serif; font-weight: 900;
      font-size: 17px; letter-spacing: 7px; color: #eaf6ff;
      text-shadow: 0 0 12px rgba(0,240,255,.8), 0 0 34px rgba(0,240,255,.35);
    }
    .logo em { color: var(--cyan); font-style: normal; }
    .sub-tag {
      font-size: 8px; letter-spacing: 3px; color: var(--muted);
      text-transform: uppercase; margin-top: 1px;
    }
    .pill {
      display: flex; align-items: center; gap: 7px; padding: 5px 13px;
      border-radius: 99px; background: rgba(0,240,255,.06);
      border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); transition: all .35s; margin-left: 2px;
    }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: all .3s; }
    .pill.on {
      background: rgba(34,229,138,.10); border-color: rgba(34,229,138,.45);
      color: var(--green); box-shadow: 0 0 14px rgba(34,229,138,.25);
    }
    .pill.on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 1.6s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
    .spacer { flex: 1; }
    .enc-badge {
      font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 700;
      letter-spacing: 2px; padding: 4px 9px; border-radius: 5px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,229,138,.10); border: 1px solid rgba(34,229,138,.4); color: var(--green); box-shadow: 0 0 10px rgba(34,229,138,.2); }
    .enc-badge.off { display: block; background: rgba(255,84,112,.08); border: 1px solid rgba(255,84,112,.35); color: var(--red); }
    .url {
      font-size: 10px; font-family: 'Courier New', monospace; color: var(--cyan);
      padding: 5px 10px; background: rgba(0,240,255,.05);
      border: 1px solid var(--border); border-radius: 7px; opacity: .8;
    }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: rgba(0,240,255,.25) transparent; }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb { background: rgba(0,240,255,.25); border-radius: 4px; }
    .msg {
      max-width: 84%; padding: 11px 15px; border-radius: 15px; font-size: 15px;
      font-weight: 500; line-height: 1.55; position: relative; overflow: hidden;
      animation: holo-in .3s cubic-bezier(.2,.9,.3,1.2);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    @keyframes holo-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
    .msg::before { /* light sweep */
      content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.09), transparent);
      animation: sweep 1.1s ease .1s; pointer-events: none;
    }
    @keyframes sweep { to { left: 130%; } }
    .msg-j {
      align-self: flex-start; background: linear-gradient(135deg, rgba(0,240,255,.10), rgba(139,92,246,.10));
      border: 1px solid rgba(0,240,255,.28); border-bottom-left-radius: 5px;
      box-shadow: 0 0 16px rgba(0,240,255,.10), inset 0 0 22px rgba(0,240,255,.04);
    }
    .msg-u {
      align-self: flex-end; background: rgba(16,26,46,.72);
      border: 1px solid rgba(139,92,246,.30); border-bottom-right-radius: 5px;
      box-shadow: 0 0 14px rgba(139,92,246,.12);
    }
    .msg-sys {
      align-self: center; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); padding: 3px 0; background: transparent; border: none;
      animation: none; font-weight: 600;
    }
    .msg-sys::before { display: none; }
    .lbl {
      font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; opacity: .7; margin-bottom: 5px;
    }
    .msg-j .lbl { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,.6); }
    .msg-u .lbl { color: var(--violet); text-align: right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end; background: rgba(16,26,46,.72);
      border: 1px solid rgba(139,92,246,.30); border-radius: 15px; border-bottom-right-radius: 5px;
      padding: 12px 15px; display: flex; align-items: center; gap: 12px;
      max-width: 84%; animation: holo-in .3s ease;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 14px rgba(139,92,246,.12);
    }
    .fc-icon { font-size: 27px; flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(0,240,255,.4)); }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-family:'Orbitron',sans-serif; font-size:8px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; opacity:.55; color:var(--cyan); margin-bottom:4px; }
    .fc-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 4px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--violet)); border-radius: 3px; transition: width .12s linear; box-shadow: 0 0 8px rgba(0,240,255,.6); }
    .fc-status { font-size: 11px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); font-family:'Orbitron',sans-serif; }
    .fc-status.done { color: var(--green); text-shadow: 0 0 8px rgba(34,229,138,.6); }
    .fc-status.err  { color: var(--red); }
    .fc-dl { display: inline-block; margin-top: 7px; font-size: 12px; color: var(--cyan); text-decoration: none; font-weight: 700; letter-spacing: .5px; }
    .fc-dl:hover { text-shadow: 0 0 10px rgba(0,240,255,.7); }

    /* ── COMMAND DOCK ── */
    footer {
      flex-shrink: 0; padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 9px; align-items: center;
      background: linear-gradient(0deg, rgba(4,8,18,.94), rgba(4,8,18,.5) 75%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    #inp {
      flex: 1; padding: 13px 16px; background: rgba(10,20,38,.7);
      border: 1.5px solid var(--border); border-radius: 14px;
      color: var(--text); font-size: 15px; font-family: inherit; font-weight: 500;
      outline: none; transition: all .2s;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #inp:focus { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,.25), inset 0 0 12px rgba(0,240,255,.05); }
    #inp::placeholder { color: var(--muted); }
    .dock-btn {
      width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
      background: rgba(10,20,38,.7); border: 1.5px solid var(--border); color: var(--muted);
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .18s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .dock-btn:hover  { border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow-c); }
    .dock-btn:active { transform: scale(.93); }
    .btn-send {
      width: auto; padding: 0 20px; height: 48px; border: none;
      font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
      color: #02141a; cursor: pointer; border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), #4da6ff);
      box-shadow: 0 0 20px rgba(0,240,255,.45);
      transition: all .18s;
    }
    .btn-send:hover  { box-shadow: 0 0 30px rgba(0,240,255,.7); filter: brightness(1.1); }
    .btn-send:active { transform: scale(.95); }
    .btn-wake {
      width: auto; padding: 0 18px; height: 48px; display: none;
      font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px;
      color: var(--green); background: rgba(34,229,138,.08);
      border: 1.5px solid rgba(34,229,138,.4); border-radius: 14px; cursor: pointer;
      box-shadow: 0 0 14px rgba(34,229,138,.2); transition: all .18s;
    }
    .btn-wake.show { display: block; animation: holo-in .25s ease; }
    .btn-wake:active { transform: scale(.95); }

    /* ── MIC with sonar rings ── */
    #mic-btn { position: relative; }
    #mic-btn.recording {
      background: rgba(255,84,112,.12); border-color: rgba(255,84,112,.55); color: var(--red);
      box-shadow: 0 0 18px rgba(255,84,112,.4);
    }
    #mic-btn.recording::before, #mic-btn.recording::after {
      content: ''; position: absolute; inset: -1.5px; border-radius: 14px;
      border: 1.5px solid rgba(255,84,112,.7); animation: sonar 1.4s ease-out infinite;
      pointer-events: none;
    }
    #mic-btn.recording::after { animation-delay: .7s; }
    @keyframes sonar {
      from { transform: scale(1); opacity: .9; }
      to   { transform: scale(1.55); opacity: 0; }
    }
    #mic-btn.unsupported { opacity: .3; }

    /* ── TOAST ── */
    #toast {
      position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%) translateY(-10px); z-index: 50;
      background: rgba(6,14,28,.9); border: 1px solid rgba(0,240,255,.4); color: var(--cyan);
      font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px;
      padding: 9px 22px; border-radius: 99px; white-space: nowrap;
      box-shadow: 0 0 22px rgba(0,240,255,.35);
      opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* voice-setup card restyle hook */
    #voice-setup { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

    /* ── OMNICONTROL Permissions overlay ── */
    #omni-btn {
      background: rgba(0,240,255,.08); border: 1px solid rgba(0,240,255,.35);
      color: var(--cyan); border-radius: 10px; padding: 6px 10px; font-size: 16px;
      cursor: pointer; margin-left: 8px;
    }
    #omni-overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      background: rgba(4,8,16,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      overflow-y: auto; padding: calc(70px + env(safe-area-inset-top)) 14px 40px;
    }
    #omni-overlay.open { display: block; }
    .omni-panel { max-width: 640px; margin: 0 auto; }
    .omni-card {
      background: rgba(10,18,34,.72); border: 1px solid rgba(0,240,255,.22);
      border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
      box-shadow: 0 0 24px rgba(0,240,255,.07);
    }
    .omni-card h3 {
      font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 3px;
      color: var(--cyan); margin: 0 0 10px; text-transform: uppercase;
    }
    .omni-card.danger { border-color: rgba(248,113,113,.5); }
    .omni-card.danger h3 { color: #f87171; }
    .omni-row { display: flex; align-items: center; gap: 8px; padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; flex-wrap: wrap; }
    .omni-row:last-child { border-bottom: none; }
    .omni-row .grow { flex: 1; min-width: 120px; color: #dde3ed; word-break: break-all; }
    .omni-row .meta { font-size: 11px; color: #5e6a7e; }
    .omni-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; letter-spacing: 1px; }
    .omni-tag.low { background: rgba(52,211,153,.15); color: #34d399; }
    .omni-tag.moderate { background: rgba(251,191,36,.15); color: #fbbf24; }
    .omni-tag.high { background: rgba(248,113,113,.15); color: #f87171; }
    .omni-tag.critical { background: rgba(248,113,113,.3); color: #fff; }
    .obtn {
      border: 1px solid rgba(0,240,255,.4); background: rgba(0,240,255,.1); color: var(--cyan);
      border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 700;
    }
    .obtn.allow { border-color: rgba(52,211,153,.6); background: rgba(52,211,153,.12); color: #34d399; }
    .obtn.deny { border-color: rgba(248,113,113,.6); background: rgba(248,113,113,.12); color: #f87171; }
    .obtn.stop { border-color: rgba(248,113,113,.8); background: rgba(248,113,113,.2); color: #fff;
      font-size: 15px; padding: 12px 20px; width: 100%; letter-spacing: 2px; }
    .obtn:disabled { opacity: .4; }
    .omni-input {
      background: rgba(255,255,255,.06); border: 1px solid rgba(0,240,255,.25);
      color: #dde3ed; border-radius: 8px; padding: 7px 10px; font-size: 13px; flex: 1; min-width: 140px;
    }
    .omni-check { display: flex; gap: 4px; align-items: center; font-size: 11px; color: #8b95a7; }
    #omni-close {
      position: fixed; top: calc(70px + env(safe-area-inset-top)); right: 14px; z-index: 101;
      background: rgba(10,18,34,.9); border: 1px solid rgba(0,240,255,.35); color: var(--cyan);
      border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; display: none;
    }
    #omni-close.show { display: block; }
  </style>
</head>
<body>
  <canvas id="cosmos"></canvas>
  <div class="aurora"></div>
  <div class="grid-floor"></div>

  <div id="toast"></div>
  <header>
    <div class="core-orb"></div>
    <div>
      <div class="logo"><em>S</em>HIRAZI</div>
      <div class="sub-tag">Neural Link</div>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <button id="omni-btn" onclick="omniOpen()" title="Permissions & control">🛡</button>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Command the core…" autocomplete="off">
    <label class="dock-btn" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" class="dock-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn-send" onclick="doSend()">SEND</button>
  </footer>

  <button id="omni-close" onclick="omniClose()">✕ CLOSE</button>
  <div id="omni-overlay"><div class="omni-panel" id="omni-panel"></div></div>

  <script>
    // ── starfield canvas ──────────────────────────────────────────────────────
    (function () {
      const cv = document.getElementById('cosmos');
      const cx = cv.getContext('2d');
      let W, H, stars = [];
      function size() {
        W = cv.width = innerWidth; H = cv.height = innerHeight;
        stars = Array.from({ length: Math.min(140, W * H / 9000) }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.4 + .3,
          s: Math.random() * .25 + .05,
          tw: Math.random() * Math.PI * 2,
          c: Math.random() < .12 ? '139,92,246' : '0,240,255'
        }));
      }
      size(); addEventListener('resize', size);
      (function tick(t) {
        cx.clearRect(0, 0, W, H);
        for (const st of stars) {
          st.y -= st.s; if (st.y < -4) { st.y = H + 4; st.x = Math.random() * W; }
          const a = .25 + .55 * Math.abs(Math.sin(t / 900 + st.tw));
          cx.beginPath();
          cx.arc(st.x, st.y, st.r, 0, 7);
          cx.fillStyle = `rgba(${st.c},${a.toFixed(2)})`;
          cx.fill();
        }
        requestAnimationFrame(tick);
      })(0);
    })();

    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('shirazi_token');
    const _sessionKey = sessionStorage.getItem('shirazi_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'SHIRAZI-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';

      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';

      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';

      return (bytes / 1024 ** 3).toFixed(2) + ' GB';

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Transmitting</div>
          <div class="fc-name">${esc(file.name)}</div>

          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'linear-gradient(90deg,#22e58a,#00f0ff)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Received';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File transmitted!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#ff5470';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Link error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {

      ].join(';');

        '<ol style="padding-left:18px;color:#8fa3bd;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#d7e6f5">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer;color:#00f0ff">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22e58a">Enabled</strong> → tap <strong style="color:#d7e6f5">Relaunch</strong></li>' +

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice uplink live — speak now');
        toast('🎤 LIVE');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice link failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
    // ── OMNICONTROL Permissions view ──────────────────────────────────────

               '</div>';

        h += '</div>';

        // Audit

        for (const a of ((auditJ.ok && auditJ.entries) || []).slice(0, 12)) {
          h += '<div class="omni-row"><span class="grow">' + _esc(a.action) +

        _omniPanel.innerHTML = h;

        _omniPanel.innerHTML = '<div class="omni-card danger"><h3>Error</h3><div class="omni-row">' +
          _esc(e.message) + '</div></div>';
      }
    }
    async function omniPlugToggle(name, enabled) {
      await _omniApi('/api/plugins/enable', { method: 'POST',
        body: JSON.stringify({ name, enabled }) });
      toast(enabled ? 'Plugin enabled' : 'Plugin disabled');
      omniRefresh();
    }
    async function omniDecide(id, decision) {
      await _omniApi('/api/omni/approve', { method: 'POST', body: JSON.stringify({ id, decision }) });
      toast(decision === 'deny' ? 'Denied' : 'Approved (' + decision + ')');
      omniRefresh();
    }
    async function omniEstop() {
      if (!confirm('Engage emergency stop? All tasks will be cancelled.')) return;
      await _omniApi('/api/omni/estop', { method: 'POST' });
      toast('⛔ STOPPED'); omniRefresh();
    }
    async function omniEstopReset() {
      await _omniApi('/api/omni/estop/reset', { method: 'POST' });
      toast('Resumed'); omniRefresh();
    }
    async function omniFolderAdd() {
      const path = document.getElementById('omni-newfolder').value.trim();
      if (!path) return;
      const r = await _omniApi('/api/omni/folder', { method: 'POST', body: JSON.stringify({
        action: 'add', path, read: true,
        write: document.getElementById('omni-fw').checked,
        exec: false, delete: document.getElementById('omni-fd').checked }) });
      toast(r.ok ? 'Folder added' : ('Error: ' + r.error)); omniRefresh();
    }
    async function omniFolderRemove(path) {
      await _omniApi('/api/omni/folder', { method: 'POST', body: JSON.stringify({ action: 'remove', path }) });
      toast('Folder removed'); omniRefresh();
    }
    async function omniRepo(action, full_name) {
      const name = full_name || document.getElementById('omni-newrepo').value.trim();
      if (!name) return;
      const r = await _omniApi('/api/omni/repo', { method: 'POST',
        body: JSON.stringify({ action, full_name: name }) });
      toast(r.ok ? 'Done' : ('Error: ' + r.error)); omniRefresh();
    }
    async function omniTaskCancel(id) {
      await _omniApi('/api/omni/task/cancel', { method: 'POST', body: JSON.stringify({ id }) });
      toast('Task cancelled'); omniRefresh();
    }
  </script>
</body>
</html>
